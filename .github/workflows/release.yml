name: release.yml
on:
  release:
    types:
      - created
  pull_request:
    types:
      - opened
      - reopened
      - synchronize



jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Golang
        uses: actions/setup-go@v4
        with:
          go-version: "^1.24"

      - name: Generate msgpack files
        run: make generate-msgp
